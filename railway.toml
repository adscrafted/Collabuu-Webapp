[build]
builder = "NIXPACKS"
buildCommand = "npm run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/"

[deploy]
startCommand = "HOSTNAME=0.0.0.0 node .next/standalone/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[nixpacks.phases.setup]]
nixPkgs = ["nodejs-20_x"]
